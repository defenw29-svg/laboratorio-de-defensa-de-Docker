version: '3.8'
services:
  web:
    image: nginx:alpine
    networks:
      perimetral:
        ipv4_address: 10.10.20.5
  ghost-attacker:
    image: alpine
    command: tail -f /dev/null
    networks:
      perimetral:
        ipv4_address: 10.10.20.99
networks:
  perimetral:
    ipam:
      config:
        - subnet: 10.10.20.0/24
  soc_interno:
    internal: true
    ipam:
      config:
        - subnet: 10.10.30.0/24
